<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classic Thanksgiving</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#fbf3e4;color:#5b3a1e;font-family:'Baloo 2',sans-serif;text-align:center}
nav{display:flex;justify-content:space-between;padding:14px 18px;font:800 24px 'Baloo 2';color:#c8541c}
.hero{padding:20px}
.bird{width:200px;height:200px;border-radius:50%;background:#f3a712;margin:10px auto;display:grid;place-items:center;font-size:20px;color:#5b3a1e}
h1{font:800 54px/1 'Baloo 2';color:#c8541c}
.btn{display:inline-block;margin-top:18px;background:#c8541c;color:#fff;font:800 26px 'Baloo 2';padding:12px 28px;border-radius:999px}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:20px}
.cards div{background:#fff;border-radius:14px;height:110px;box-shadow:0 4px 12px rgba(91,58,30,.15)}
</style></head><body>
<nav><span>Uncle Turkey</span><span>☰</span></nav>
<section class="hero"><div class="bird">Turkey</div><h1>Uncle Turkey</h1><a class="btn">Play Turkey Hunt</a></section>
<div class="cards"><div></div><div></div><div></div></div>
</body></html>

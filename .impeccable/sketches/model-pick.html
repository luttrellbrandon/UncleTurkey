<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Gobbler Enquirer</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--red:#d7141a;--ink:#111;--news:#f4efe2;--yel:#ffe600}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:var(--news);color:var(--ink);font-family:'Oswald',sans-serif}
.mast{background:var(--red);color:#fff;padding:10px 12px 8px;text-align:center;border-bottom:5px solid var(--ink)}
.mast b{font:400 50px/.9 'Anton';text-transform:uppercase;letter-spacing:-.01em}
.mast small{display:block;font:700 12px 'Oswald';text-transform:uppercase;letter-spacing:.1em}
.strap{background:var(--yel);font:700 13px 'Oswald';text-transform:uppercase;padding:6px 12px;display:flex;justify-content:space-between}
h1{font:400 70px/.88 'Anton';text-transform:uppercase;padding:12px 12px 6px;letter-spacing:-.01em}
h1 span{color:var(--red)}
.evidence{margin:6px 12px;height:250px;background:repeating-radial-gradient(circle at 30% 40%,#777 0 2px,#999 2px 5px);position:relative;border:3px solid var(--ink);filter:grayscale(1) contrast(1.2)}
.ring{position:absolute;left:150px;top:70px;width:110px;height:110px;border:5px solid var(--red);border-radius:50%;filter:none}
.note{position:absolute;right:8px;bottom:8px;font:400 26px 'Permanent Marker';color:var(--red);transform:rotate(-8deg);filter:none}
.cap{font:700 13px 'Oswald';padding:0 12px;text-transform:uppercase}
.cta{margin:12px;background:var(--ink);color:var(--yel);padding:14px;display:flex;justify-content:space-between;align-items:center}
.cta b{font:400 36px/.9 'Anton';text-transform:uppercase}
.cta span{font:400 44px 'Anton'}
</style></head><body>
<header class="mast"><b>Gobbler Enquirer</b><small>Thanksgiving extra · 99¢</small></header>
<div class="strap"><span>Exclusive</span><span>Photos inside</span></div>
<h1>Uncle Turkey <span>spotted</span> at 3 buffets</h1>
<div class="evidence"><div class="ring"></div><div class="note">It's him!!</div></div>
<p class="cap">Blurry "evidence" (Turkey Asset slot)</p>
<a class="cta"><b>Catch him<br>yourself</b><span>→</span></a>
</body></html>
